name: Build Flutter Apps (macOS & Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_NODE24: true

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --no-tree-shake-icons

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenkliNotlar-Windows
          path: build/windows/x64/runner/Release/

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --no-tree-shake-icons

      - name: Zip macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r renkli-notlar-macos.zip renkli_notlar.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenkliNotlar-macOS
          path: build/macos/Build/Products/Release/renkli-notlar-macos.zip
